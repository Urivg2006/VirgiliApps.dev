<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">Presentació</title>
  <link rel="icon" type="image/png" href="assets/Icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body style="background-color: #0f172a; padding: 20px; border-radius: 10px;">
  <div class="container mt-5">
    <div class="p-5 mb-4 bg-light rounded-3">
      <div class="container-fluid py-5">
        <div class="d-flex justify-content-end mb-3">
          <label for="idiomaSelect" class="me-2 fw-semibold" data-i18n="languageLabel">Idioma:</label>
          <select id="idiomaSelect" class="form-select form-select-sm w-auto">
            <option value="app_ca">Català</option>
            <option value="app_es">Español</option>
            <option value="app_en">English</option>
          </select>
        </div>
        <img src="assets/Logo.png" alt="Logo" class="img-fluid mb-4" style="max-width: 400px;">
        <p class="col-md-8 fs-4" data-i18n="construction">En Construcció...</p>
        <p class="col-md-8 fs-4" data-i18n="development">Apps en desenvolupament:</p>
        <div class="card shadow-sm p-4 text-center" style="max-width: 300px;">
          <div class="card-body d-flex flex-column align-items-center">
            <img src="assets/ExploreCity.png" alt="ExploreCity" class="img-fluid mb-3" style="max-width: 100px;">
            <a href="https://explorecity.web.app/" class="btn btn-primary w-100"
              style="background-color: #2563eb; color: white;" data-i18n="viewExploreCity">Veure ExploreCity</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="./l10n/canviarIdioma.js"></script>
</body>

</html>
